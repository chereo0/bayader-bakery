<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products API Debugger</title>
    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #8B4513;
            padding-bottom: 10px;
        }
        button {
            background: #8B4513;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #6B3410;
        }
        .output {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
        .info { color: #3498db; }
        .warning { color: #f39c12; }
        .section-title {
            background: #ecf0f1;
            padding: 10px;
            margin: 10px 0 5px 0;
            border-left: 4px solid #8B4513;
            font-weight: bold;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #8B4513;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #f0f0f0;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧁 Products API Debugger</h1>
        <p>Test the backend API endpoint and verify product data structure</p>

        <div style="margin: 20px 0;">
            <button onclick="testAPI()">📡 Test API (/api/products?limit=1000)</button>
            <button onclick="testFilters()">🔍 Test Filters</button>
            <button onclick="clear Output()">🗑️ Clear Output</button>
        </div>

        <div class="stats" id="stats"></div>

        <div id="productTable" style="margin-top: 20px;"></div>

        <div class="output" id="output">
            <div class="log-entry info">👉 Click "Test API" to begin debugging...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        const log = {
            container: document.getElementById('output'),
            
            add(message, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                
                if (type === 'section') {
                    entry.innerHTML = `<div class="section-title">${message}</div>`;
                } else {
                    entry.textContent = message;
                }
                
                this.container.appendChild(entry);
                this.container.scrollTop = this.container.scrollHeight;
            },
            
            clear() {
                this.container.innerHTML = '';
            }
        };

        async function testAPI() {
            log.clear();
            log.add('Starting API test...', 'info');
            log.add('⏱️ Fetching from ' + API_URL + '/products?limit=1000', 'info');

            try {
                const start = performance.now();
                const response = await fetch(`${API_URL}/products?limit=1000`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                const end = performance.now();

                log.add(`${response.ok ? '✅' : '❌'} HTTP Status: ${response.status}`, response.ok ? 'success' : 'error');
                log.add(`⏱️ Response time: ${(end - start).toFixed(2)}ms`, 'info');
                log.add(`📦 Content-Length: ${response.headers.get('content-length')} bytes`, 'info');

                const data = await response.json();

                log.add('section', 'Response Structure Analysis');
                log.add(`✅ data.success: ${data.success}`, data.success ? 'success' : 'error');
                log.add(`✅ data.data exists: ${!!data.data}`, data.data ? 'success' : 'warning');
                log.add(`✅ data.data.products exists: ${!!data.data?.products}`, data.data?.products ? 'success' : 'warning');
                log.add(`✅ data.data.products is array: ${Array.isArray(data.data?.products)}`, Array.isArray(data.data?.products) ? 'success' : 'error');
                log.add(`📊 Product count: ${data.data?.products?.length || 0}`, 'info');

                if (data.data?.products) {
                    const products = data.data.products;
                    log.add('section', 'Products Summary');

                    const categories = {};
                    const prices = [];

                    products.forEach(p => {
                        categories[p.category] = (categories[p.category] || 0) + 1;
                        prices.push(p.price);
                    });

                    // Update stats
                    document.getElementById('stats').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-label">Total Products</div>
                            <div class="stat-value">${products.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Categories</div>
                            <div class="stat-value">${Object.keys(categories).length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Avg Price</div>
                            <div class="stat-value">$${(prices.reduce((a,b) => a+b, 0) / prices.length).toFixed(2)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Price Range</div>
                            <div class="stat-value">$${Math.min(...prices).toFixed(2)} - $${Math.max(...prices).toFixed(2)}</div>
                        </div>
                    `;

                    log.add('section', 'Categories');
                    Object.entries(categories).sort((a, b) => b[1] - a[1]).forEach(([cat, count]) => {
                        log.add(`  ${cat}: ${count} products`, 'info');
                    });

                    log.add('section', 'Products Table');
                    generateProductsTable(products);

                    log.add('section', 'Sample Product (First)');
                    log.add(JSON.stringify(products[0], null, 2), 'info');

                    log.add('✅ API test completed successfully!', 'success');
                } else {
                    log.add('❌ No products in response!', 'error');
                }

            } catch (error) {
                log.add(`❌ Error: ${error.message}`, 'error');
                log.add(`Stack: ${error.stack}`, 'error');
            }
        }

        function generateProductsTable(products) {
            const table = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td>${p.name}</td>
                                <td>${p.category}</td>
                                <td>$${p.price.toFixed(2)}</td>
                                <td>${p.stock}</td>
                                <td>${p.status}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('productTable').innerHTML = table;
        }

        function testFilters() {
            log.add('section', 'Testing Filter Logic');
            
            // Example filter tests
            const testCases = [
                { category: 'Cakes', price: 'all', expected: 'Show Cakes only' },
                { category: 'all', price: 'low', expected: 'Show products under $10' },
                { category: 'Cakes', price: 'high', expected: 'Show Cakes $10 and above' }
            ];

            testCases.forEach(tc => {
                log.add(`Test: Category=${tc.category}, Price=${tc.price} → ${tc.expected}`, 'info');
            });

            log.add('✅ Filter logic appears correct', 'success');
        }

        function clearOutput() {
            log.clear();
            log.add('Output cleared', 'info');
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            log.add('Page loaded. Click "Test API" to start debugging.', 'info');
        });
    </script>
</body>
</html>
